# Vistaaram backend stack for a single Oracle Cloud VM.
#
#   cd backend/deploy
#   cp env.example .env         # then fill it in
#   docker compose up -d --build
#
# Two ways to run it:
#   Shared server (e.g. alongside WordPress/CyberPanel): `docker compose up -d --build`
#     Medusa listens on 127.0.0.1:9000 only; the existing web server (OpenLiteSpeed) proxies
#     api.vistaaram.in to it. Postgres and Redis are never reachable from outside.
#   Dedicated server: `docker compose --profile standalone up -d --build`
#     Also starts Caddy on ports 80/443 with automatic HTTPS.
# Memory limits keep the store from starving other sites on a shared server.

name: vistaaram

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  medusa:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MEDUSA_BACKEND_URL: https://${API_DOMAIN}
    restart: unless-stopped
    mem_limit: 3g
    env_file: .env
    ports:
      # Loopback only: reachable from this server's web server, not from the internet.
      - "127.0.0.1:9000:9000"
    environment:
      NODE_ENV: production
      PORT: "9000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MEDUSA_BACKEND_URL: https://${API_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - medusa

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
